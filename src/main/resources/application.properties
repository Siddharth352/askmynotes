spring.application.name=askmynotes
spring.datasource.url=jdbc:postgresql://localhost:5432/asknotes
spring.datasource.username=asknotes
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:file:./.env[.properties]
spring.ai.model.embedding=openai
spring.ai.openai.base-url=${AZURE_OPENAI_BASE_URL}
spring.ai.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.openai.embedding.model=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}


spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE